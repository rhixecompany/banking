name: CI Reports

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run CI checks
        run: bunx tsx scripts/ts/run-ci-checks.ts --report-dir ./ci-reports/linux || true
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-linux
          path: ci-reports/linux/**

  targeted-run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run targeted checks
        run: bunx tsx scripts/ts/run-ci-checks.ts --only=format-check,lint-fix --report-dir ./ci-reports/targeted || true
      - name: Upload targeted reports
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-targeted-${{ matrix.os }}
          path: ci-reports/targeted/**

  run-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run CI checks
        run: bunx tsx scripts/ts/run-ci-checks.ts --report-dir ./ci-reports/windows || true
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-windows
          path: ci-reports/windows/**
